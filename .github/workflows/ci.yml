# CI for photo-to-print.
#
# GitHub Actions only discovers workflows in a repo's root .github/workflows/,
# so while this tree is staged inside a larger repository this file is inert.
# It runs once the tree is its own repository root.
#
# The Blender-side checks are proven by `python3 scripts/kit.py selftest`,
# which needs Blender and is run locally before release, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pillow numpy

      - name: Run tests
        run: python -m unittest discover -s tests -v
